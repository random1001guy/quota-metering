# docker compose up   -> stores, seed, 3 quota instances, 2 dummy-tracking-feature instances, and
#                        load-tester-client: it runs the correctness checks (PASS/FAIL per test), then
#                        keeps ~2,000 ops/s of load going, printing live stats every 5 s
# docker compose run --rm load-tester-client check 2 --requests 2000 --limit 300   -> one test, own numbers
# Host ports: quota 8000-8002, dummy-tracking-feature 9000-9001. Postgres/Redis stay internal
# unless docker-compose.test.yml is added (needed only for running pytest from the host).
# Reservation timeout: 10 s for this demo (service default 30 s) so the crashed-client check
# doesn't wait long. The checks need the same value, hence one anchor for both services.
x-reserve-timeout: &reserve-timeout "10"

x-health: &health
  interval: 2s
  retries: 30

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
  <<: *health

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
      POSTGRES_DB: quota
    # No host port by default (avoids clashing with a local Postgres); the pytest suite publishes
    # it through docker-compose.test.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota"]
      <<: *health

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health

  # One-off: creates the schema (db/schema.sql, baked into the image) and seeds placeholder data.
  seed:
    build: .
    command: ["python", "-m", "quota.seed"]
    environment:
      DATABASE_URL: postgresql://quota:quota@postgres:5432/quota
    depends_on:
      postgres:
        condition: service_healthy

  # The quota service. 3 instances behind one DNS name; nothing is counted per instance.
  quota:
    build: .
    command: ["uvicorn", "quota.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log",
              "--timeout-keep-alive", "30"]
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql://quota:quota@postgres:5432/quota
      REDIS_URL: redis://redis:6379/0
      RESERVE_TIMEOUT_S: *reserve-timeout
    ports:
      - "8000-8002:8000"
    healthcheck: *python-health
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Demo product service that consumes quota (container tracking, schedule search).
  dummy-tracking-feature:
    build: .
    command: ["uvicorn", "demo.dummy_tracking_feature:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log",
              "--timeout-keep-alive", "30"]
    deploy:
      replicas: 2
    environment:
      QUOTA_URL: http://quota:8000
      DATABASE_URL: postgresql://quota:quota@postgres:5432/quota
    ports:
      - "9000-9001:8000"
    healthcheck: *python-health
    depends_on:
      quota:
        condition: service_healthy

  # Runs the correctness checks once, then keeps dummy-tracking-feature under sustained load,
  # printing throughput, outcomes and quota overhead every 5 s.
  load-tester-client:
    build: .
    # entrypoint (not command), so `docker compose run --rm load-tester-client check 2 ...` passes
    # its arguments to the program
    entrypoint: ["python", "-m", "demo.load_tester_client"]
    environment:
      CONSUMER_URL: http://dummy-tracking-feature:8000
      QUOTA_URL: http://quota:8000
      DATABASE_URL: postgresql://quota:quota@postgres:5432/quota
      RESERVE_TIMEOUT_S: *reserve-timeout
      RATE: ${LOAD_RATE:-2000}    # ops/s (the brief's sustained rate)
      ORGS: ${LOAD_ORGS:-1000}    # orgs 1..ORGS of the 5,000 seeded: starter orgs run out within minutes, so 429s show
    depends_on:
      dummy-tracking-feature:
        condition: service_healthy
