[project]
name = "quota-metering"
version = "0.1.0"
description = "Per-org, per-feature monthly quota service (Redis leases backed by Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis[hiredis]>=5.2",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["concurrency: multi-instance load tests (slow); run with `pytest -m concurrency`"]
addopts = "-m 'not concurrency'"
